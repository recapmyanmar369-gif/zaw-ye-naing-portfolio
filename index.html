<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieRecap AI - Myanmar Dubbing Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">🎬 MovieRecap AI Studio</h1>
            <p class="text-sm text-slate-400 mt-2">ဗွီဒီယိုဖိုင်တင်လိုက်တာနဲ့ မူရင်းအသံဖျက်ပြီး မြန်မာ AI အသံဖြင့် အလိုအလျောက် ပြောင်းလဲပေးမည်။</p>
        </div>

        <form id="uploadForm" class="space-y-6">
            <div class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer transition">
                <input type="file" id="videoFile" name="file" accept="video/mp4,video/mkv" class="hidden" required>
                <label for="videoFile" class="cursor-pointer">
                    <div class="text-4xl mb-2">📁</div>
                    <p class="font-medium text-slate-300" id="fileName">ဗွီဒီယိုဖိုင်ကို ဤနေရာသို့ ဆွဲထည့်ပါ (သို့) ရွေးချယ်ပါ</p>
                    <p class="text-xs text-slate-500 mt-1">MP4, MKV (Max: 2GB)</p>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-semibold py-3 rounded-xl shadow-lg transition">
                🚀 Generate Myanmar Recap Video
            </button>
        </form>

        <div id="statusBox" class="hidden mt-6 p-4 rounded-xl bg-slate-800 border border-slate-700 text-center text-sm">
            <p id="statusText" class="text-yellow-400 animate-pulse">⏳ ဗွီဒီယိုကို လုပ်ဆောင်နေပါပြီ (Processing)... ခဏစောင့်ပေးပါ။</p>
            <a id="downloadLink" href="#" class="hidden mt-3 inline-block bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg font-medium">📥 Download Recap Video</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('videoFile');
        const fileNameText = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const downloadLink = document.getElementById('downloadLink');

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileNameText.textContent = e.target.files[0].name;
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            statusBox.classList.remove('hidden');
            statusText.textContent = "⏳ ဗွီဒီယို တင်နေခြင်းနှင့် AI ဘာသာပြန်ဆိုခြင်းများ လုပ်ဆောင်နေပါပြီ...";
            downloadLink.classList.add('hidden');

            try {
                const response = await fetch('/api/process-movie/', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if(response.ok) {
                    statusText.textContent = "✅ အောင်မြင်စွာ ပြီးဆုံးပါပြီ!";
                    downloadLink.href = result.download_url;
                    downloadLink.classList.remove('hidden');
                } else {
                    statusText.textContent = "❌ Error: " + result.detail;
                }
            } catch (err) {
                statusText.textContent = "❌ Server ချိတ်ဆက်မှု အမှားရှိနေပါသည်။";
            }
        });
    </script>
</body>
</html>
